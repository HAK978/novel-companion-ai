[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    # Several paths deliberately swallow exceptions so a failure degrades
    # rather than cascades: entity extraction is best-effort and must not fail
    # ingestion, and health checks report "degraded" instead of crashing.
    "BLE001",
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# Test stubs intentionally define minimal doubles.
"tests/*" = ["B008"]
# Prompt templates are content, not code: wrapping a line would change the text
# the model actually receives.
"services/generation/llm_handler.py" = ["E501"]
"services/generation/main.py" = ["E501"]
