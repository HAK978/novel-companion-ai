name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The db test tier runs migrations and real SQL against this throwaway database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novel
          POSTGRES_PASSWORD: novel
          POSTGRES_DB: novel_companion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel -d novel_companion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Without this, an unreachable database would skip the db tier instead of failing it
      REQUIRE_DB: "1"
      TEST_DATABASE_URL: postgresql://novel:novel@localhost:5432/novel_companion_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # Integration tests need the full running stack and a GPU, so they stay skipped.
        # Everything else runs: stubbed unit and API tests, an embedded Chroma, and the
        # db tier against the Postgres service above.
        run: pytest -v --cov=services --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check
        run: ruff check services/ tests/ scripts/ --output-format=github

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npm run build
