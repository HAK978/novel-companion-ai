name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Runner image pinned like the dependencies: ubuntu-latest moves to a new release on its own
# schedule, which can break CI with no change here.
jobs:
  test:
    runs-on: ubuntu-24.04

    # The db test tier runs migrations and real SQL against this throwaway database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novel
          POSTGRES_PASSWORD: novel
          POSTGRES_DB: novel_companion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novel -d novel_companion"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Without this, an unreachable database would skip the db tier instead of failing it
      REQUIRE_DB: "1"
      TEST_DATABASE_URL: postgresql://novel:novel@localhost:5432/novel_companion_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # Stubbed unit and API tests, an embedded Chroma, and the db tier against the
        # Postgres service above. The end-to-end tests run in the stack job.
        run: pytest -v --cov=services --cov-report=term-missing

  stack:
    # Builds every image and runs the whole application in Compose, with a stub model
    # server in place of vLLM, then tests it end to end through the gateway. A Dockerfile
    # that stops building or a service that stops starting fails here.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      # the tests write their novel here; the ingestion worker reads it at /novels
      NOVEL_DATA_DIR: ${{ github.workspace }}/e2e-novels

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          mkdir -p "$NOVEL_DATA_DIR"
          HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: End-to-end tests
        env:
          RUN_INTEGRATION: "1"
        run: pytest -v tests/test_integration.py

      - name: Service logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # pinned: new ruff releases add rules that would fail unchanged code
        run: pip install ruff==0.16.7

      - name: Check
        run: ruff check services/ tests/ scripts/ eval/ --output-format=github

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npm run build
